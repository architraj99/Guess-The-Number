<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-card">

        <div class="top-section">

            
            <div class="top-badge">
                Number Game
            </div>

            <div class="mode-box">
                Difficulty: <select id="difficulty"> 
                <option value="50">Easy</option>
                <option value="100" selected>Medium</option>
                <option value="200">Hard</option>
                </select>
            </div>

        </div>


        <h1>
            Guess The Number 
        </h1>

        <p class="subtitle">
            Guess the secret number
        </p>

        <input type="number" id="guessInput" placeholder="Enter your guess">

        <button id="guessBtn">
            Check Guess
        </button>

        <button id="restartBtn">
            Restart Game
        </button>

        <div class="message">
            Start guessing...
        </div>

        <div class="stats">

            <div class="attempts">
                Attempts: 0 / 10
            </div>

            <div class="best-score">
                Best: 0
            </div>

        </div>


    </div>

    <script src="script.js"></script>

</body>
</html>
