<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-card">

        <div class="top-badge">
            Number Game
        </div>

        <h1>
            Guess The Number 
        </h1>

        <p class="subtitle">
            Guess a number between 1 and 100
        </p>

        <input
            type="number"
            id="guessInput"
            placeholder="Enter your guess"
        >

        <button id="guessBtn">
            Check Guess
        </button>

        <button id="restartBtn">
            Restart Game
        </button>

        <div class="message">
            Start guessing...
        </div>

        <div class="attempts">
            Attempts: 0 / 10
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
